<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回声 Echo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #F4F6FB; padding: 16px; }
        .container { max-width: 440px; margin: 0 auto; }
        .card { background: #fff; border-radius: 16px; padding: 24px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
        input, textarea { width: 100%; padding: 14px; border: 1.5px solid #E8ECF4; border-radius: 12px; font-size: 15px; margin-bottom: 12px; }
        .btn { width: 100%; padding: 14px; background: #5B6ABF; color: #fff; border: none; border-radius: 50px; font-size: 16px; cursor: pointer; }
        .btn:disabled { opacity: 0.6; }
        .hidden { display: none; }
        .tabs { display: flex; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 10px; border-radius: 50px; cursor: pointer; background: #eee; }
        .tab.active { background: #5B6ABF; color: #fff; }
        .brand { font-size: 32px; font-weight: 700; color: #5B6ABF; letter-spacing: 4px; }
        .brand-sub { color: #999; margin: 10px 0 20px; }
        .msg { max-width: 80%; margin: 8px 0; padding: 10px 16px; border-radius: 18px; clear: both; }
        .msg.other { background: #eee; float: left; }
        .msg.mine { background: #5B6ABF; color: #fff; float: right; }
        .msg.system { text-align: center; color: #999; font-size: 13px; float: none; }
        .chat-box { max-height: 300px; overflow-y: auto; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="container">
    <!-- 登录注册页 -->
    <div id="page-auth">
        <div class="card" style="text-align:center;">
            <h1 class="brand">回声</h1>
            <p class="brand-sub">有些话，山谷会替你记得</p>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">登录</div>
                <div class="tab" onclick="switchTab('register')">注册</div>
            </div>
            <div id="form-login">
                <input id="login-phone" placeholder="手机号">
                <input type="password" id="login-password" placeholder="密码">
                <button class="btn" onclick="handleLogin()">进入回声</button>
            </div>
            <div id="form-register" class="hidden">
                <input id="reg-phone" placeholder="手机号">
                <input type="password" id="reg-password" placeholder="密码(6位以上)">
                <button class="btn" onclick="handleRegister()">创建账号</button>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="page-main" class="hidden">
        <div class="card">
            <h3 style="margin-bottom:12px;">📡 喊出你的话</h3>
            <input id="target-phone" placeholder="对方手机号">
            <input id="your-name" placeholder="你的名字">
            <textarea id="message-content" placeholder="你想说的话..." style="height:80px;resize:vertical;"></textarea>
            <button class="btn" id="send-btn" onclick="createRoom()">📡 发出回声</button>
        </div>
        <div id="result-card" class="card hidden" style="text-align:center;">
            <h2>✅ 回声已发出</h2>
            <p style="color:#999;">复制短信内容，手动发送给对方</p>
            <div id="result-sms" style="background:#EEF0FA;padding:12px;border-radius:12px;margin:10px 0;word-break:break-all;text-align:left;"></div>
            <button class="btn" onclick="copySms()">📋 复制短信内容</button>
        </div>
        <button class="btn" style="background:#fff;color:#5B6ABF;border:1.5px solid #5B6ABF;margin-top:10px;" onclick="logout()">退出</button>
    </div>

    <!-- 接收者页面 -->
    <div id="page-join" class="hidden">
        <div class="card" style="text-align:center;">
            <h2>🏔️ 听到一声回声...</h2>
            <p style="color:#999;margin-bottom:16px;">输入回音口令倾听</p>
            <input id="join-passcode" placeholder="例如：空谷-悠长的-901">
            <button class="btn" onclick="joinRoom()">侧耳倾听</button>
            <p id="join-error" style="color:red;margin-top:8px;"></p>
        </div>
        <div id="chat-join" class="card hidden">
            <div class="chat-box" id="chat-box"></div>
            <div style="display:flex;gap:8px;">
                <input id="join-message" placeholder="你的回应..." style="flex:1;">
                <button class="btn" style="width:auto;" onclick="sendJoinMsg()">发送</button>
            </div>
        </div>
    </div>
</div>

<script>
// ========== 配置 ==========
const ENV_ID = 'echo-d1ggxqxb47c1224f7';
const API_BASE = `https://${ENV_ID}.service.tcloudbase.com`;

let accessToken = null;
let currentUser = null;
let currentRoom = null;
let pollingInterval = null;

// ========== 页面切换 ==========
function showPage(id) {
    document.querySelectorAll('#page-auth,#page-main,#page-join').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}
function switchTab(t) {
    document.querySelectorAll('.tab')[0].classList.toggle('active', t==='login');
    document.querySelectorAll('.tab')[1].classList.toggle('active', t==='register');
    document.getElementById('form-login').classList.toggle('hidden', t!=='login');
    document.getElementById('form-register').classList.toggle('hidden', t!=='register');
}

// ========== HTTP 请求封装 ==========
async function api(method, path, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (accessToken) headers['Authorization'] = `Bearer ${accessToken}`;
    const res = await fetch(`${API_BASE}${path}`, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || '请求失败');
    return data;
}

// ========== 登录 ==========
async function handleLogin() {
    const phone = document.getElementById('login-phone').value.trim();
    const pw = document.getElementById('login-password').value.trim();
    if (!phone || !pw) return alert('请输入手机号和密码');
    try {
        const result = await api('POST', '/auth/v1/signin', {
            username: phone,
            password: pw
        });
        accessToken = result.access_token;
        currentUser = { uid: result.sub, username: phone };
        showPage('page-main');
    } catch(e) {
        alert('登录失败: ' + e.message);
    }
}

// ========== 注册 ==========
async function handleRegister() {
    const phone = document.getElementById('reg-phone').value.trim();
    const pw = document.getElementById('reg-password').value.trim();
    if (!phone || pw.length < 6) return alert('密码至少6位');
    try {
        await api('POST', '/auth/v1/signup', {
            username: phone,
            password: pw
        });
        // 注册成功后自动登录
        const result = await api('POST', '/auth/v1/signin', {
            username: phone,
            password: pw
        });
        accessToken = result.access_token;
        currentUser = { uid: result.sub, username: phone };
        showPage('page-main');
    } catch(e) {
        alert('注册失败: ' + e.message);
    }
}

function logout() {
    accessToken = null;
    currentUser = null;
    showPage('page-auth');
}

// ========== 生成回声 ==========
function createRoom() {
    if (!currentUser) return alert('请先登录');
    const phone = document.getElementById('target-phone').value.trim();
    const name = document.getElementById('your-name').value.trim();
    const content = document.getElementById('message-content').value.trim();
    if (!phone || !name || !content) return alert('请完整填写');

    const nouns = ['空谷','松涛','晚钟','风铃','潮汐','山泉','竹林','夜莺','鲸歌','风笛'];
    const adjs = ['悠长的','遥远的','轻柔的','清澈的','温暖的','寂静的','微弱的','坚定的'];
    const pc = nouns[Math.floor(Math.random()*10)] + '-' + adjs[Math.floor(Math.random()*8)] + '-' + Math.floor(Math.random()*900+100);
    
    const sms = name + ' 给你留下一声回声："' + content + '"。倾听请至 ' + window.location.href + ' ，回音口令：' + pc + ' 。退订回T';
    
    document.getElementById('result-sms').textContent = sms;
    document.getElementById('result-card').classList.remove('hidden');
}

function copySms() {
    const txt = document.getElementById('result-sms').textContent;
    navigator.clipboard.writeText(txt).then(() => alert('已复制！打开短信粘贴发送')).catch(() => alert('复制失败，请手动复制'));
}

// ========== 接收者加入 ==========
async function joinRoom() {
    const pc = document.getElementById('join-passcode').value.trim();
    if (!pc) return;
    try {
        const res = await api('POST', '/api/database/query', {
            Mgo: 'rooms',
            filter: { passcode: pc },
            limit: 1
        });
        if (!res.data || res.data.length === 0) {
            document.getElementById('join-error').textContent = '口令错误';
            return;
        }
        currentRoom = res.data[0];
        document.getElementById('page-join').querySelector('.card').classList.add('hidden');
        document.getElementById('chat-join').classList.remove('hidden');
        const box = document.getElementById('chat-box');
        box.innerHTML = '';
        addMsg('system', '"' + currentRoom.creatorName + '" 的回声：');
        addMsg('other', currentRoom.initialMessage);
        startPolling();
    } catch(e) {
        document.getElementById('join-error').textContent = '网络错误，请重试';
    }
}

function addMsg(type, text) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

async function sendJoinMsg() {
    if (!currentRoom) return;
    const text = document.getElementById('join-message').value.trim();
    if (!text) return;
    await api('POST', '/api/database/insert', {
        Mgo: 'messages',
        data: { roomId: currentRoom._id, senderType: 'guest', senderName: '匿名', content: text }
    });
    addMsg('mine', text);
    document.getElementById('join-message').value = '';
}

function startPolling() {
    if (pollingInterval) clearInterval(pollingInterval);
    pollingInterval = setInterval(async () => {
        if (!currentRoom) return;
        try {
            const res = await api('POST', '/api/database/query', {
                Mgo: 'messages',
                filter: { roomId: currentRoom._id },
                order: ['createdAt', 'asc'],
                limit: 30
            });
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            if (res.data) res.data.forEach(m => addMsg(m.senderType==='guest'?'mine':'other', m.content));
        } catch(e) {}
    }, 3000);
}

window.onload = function() { showPage('page-auth'); };
</script>
</body>
</html>
