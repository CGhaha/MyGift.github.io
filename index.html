<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>回声 Echo</title>
    <style>
        :root {
            --primary: #5B6ABF; --primary-light: #EEF0FA; --bg: #F4F6FB;
            --surface: #FFFFFF; --text: #1E2746; --text-secondary: #6F7A9C;
            --border: #E8ECF4; --danger: #E06C75;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; justify-content: center;
            padding: 16px;
        }
        .app-container { width: 100%; max-width: 440px; }
        .card {
            background: var(--surface); border-radius: 16px;
            padding: 24px; margin-bottom: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }
        .download-bar {
            background: linear-gradient(135deg, #5B6ABF, #7B8CD6);
            color: white; padding: 12px 16px; border-radius: 12px;
            margin-bottom: 16px; display: flex;
            align-items: center; justify-content: space-between;
        }
        .download-bar a {
            background: white; color: #5B6ABF;
            padding: 8px 16px; border-radius: 20px;
            font-weight: 600; text-decoration: none; font-size: 14px;
        }
        .input-group { position: relative; margin-bottom: 16px; }
        .input-group .icon {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%); font-size: 18px;
            color: var(--text-secondary);
        }
        .input-group input, .input-group textarea {
            width: 100%; padding: 14px 16px 14px 44px;
            background: var(--bg); border: 1.5px solid transparent;
            border-radius: 12px; font-size: 15px;
        }
        .input-group textarea { min-height: 100px; resize: vertical; }
        .input-group input:focus, .input-group textarea:focus {
            outline: none; border-color: var(--primary);
        }
        .btn {
            width: 100%; padding: 14px; border: none;
            border-radius: 50px; font-size: 16px;
            font-weight: 600; cursor: pointer;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn:disabled { opacity: 0.6; }
        .tabs {
            display: flex; background: var(--bg);
            border-radius: 50px; padding: 4px; margin-bottom: 24px;
        }
        .tab {
            flex: 1; text-align: center; padding: 10px;
            border-radius: 50px; color: var(--text-secondary); cursor: pointer;
        }
        .tab.active {
            background: var(--surface); color: var(--text); font-weight: 600;
        }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .brand-title {
            font-size: 32px; font-weight: 700;
            color: var(--primary); letter-spacing: 4px;
        }
        .brand-sub { color: var(--text-secondary); margin-bottom: 24px; }
        .room-item {
            display: flex; justify-content: space-between;
            padding: 16px 0; border-bottom: 1px solid var(--border);
        }
        .room-passcode {
            font-family: monospace; background: var(--primary-light);
            color: var(--primary); padding: 4px 10px;
            border-radius: 20px; font-size: 13px;
        }
        .chat-box { max-height: 350px; overflow-y: auto; }
        .msg {
            max-width: 80%; margin: 12px 0; padding: 10px 16px;
            border-radius: 18px; clear: both; word-wrap: break-word;
        }
        .msg.other { background: var(--bg); float: left; }
        .msg.mine { background: var(--primary); color: white; float: right; }
        .msg.system {
            text-align: center; color: var(--text-secondary);
            font-size: 13px; float: none;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div id="page-auth">
        <div class="card text-center" style="padding:32px 24px;">
            <h1 class="brand-title">回声</h1>
            <span class="brand-sub">有些话，山谷会替你记得</span>
            <div class="tabs">
                <div id="tab-login" class="tab active" onclick="switchTab('login')">登录</div>
                <div id="tab-register" class="tab" onclick="switchTab('register')">注册</div>
            </div>
            <div id="form-login">
                <div class="input-group"><span class="icon">📱</span><input id="login-phone" placeholder="手机号"></div>
                <div class="input-group"><span class="icon">🔒</span><input type="password" id="login-password" placeholder="密码"></div>
                <button class="btn btn-primary" onclick="handleLogin()">进入回声</button>
            </div>
            <div id="form-register" class="hidden">
                <div class="input-group"><span class="icon">📱</span><input id="reg-phone" placeholder="手机号"></div>
                <div class="input-group"><span class="icon">🔒</span><input type="password" id="reg-password" placeholder="密码(6位以上)"></div>
                <button class="btn btn-primary" onclick="handleRegister()">创建账号</button>
            </div>
        </div>
        <div class="download-bar"><div><strong>📱 回声 App</strong><span style="font-size:13px;opacity:0.9;">更快更稳定</span></div><a href="#">下载</a></div>
    </div>

    <div id="page-main" class="hidden">
        <div class="download-bar"><div><strong>📱 回声 App</strong><span style="font-size:13px;opacity:0.9;">更快更稳定</span></div><a href="#">下载</a></div>
        <div style="text-align:center;color:var(--text-secondary);margin-bottom:8px;">声音已发出，正在等待回声...</div>
        <div class="card">
            <h3 style="margin-bottom:12px;">📡 喊出你的话</h3>
            <div class="input-group"><span class="icon">📞</span><input id="target-phone" placeholder="对方手机号"></div>
            <div class="input-group"><span class="icon">👤</span><input id="your-name" placeholder="你的名字"></div>
            <div class="input-group"><span class="icon">💬</span><textarea id="message-content" placeholder="你想说的话..."></textarea></div>
            <button class="btn btn-primary" id="send-btn" onclick="createRoom()">📡 发出回声</button>
        </div>
        <div id="result-card" class="card hidden text-center">
            <span style="font-size:40px;">✅</span>
            <h3>回声已发出</h3>
            <p style="color:var(--text-secondary);">对方将收到短信，内含回音口令</p>
            <div style="background:var(--primary-light);padding:12px;border-radius:12px;font-size:22px;color:var(--primary);font-weight:600; margin-top:10px;" id="result-passcode"></div>
        </div>
        <div class="card"><h3 style="margin-bottom:8px;">📂 我发出的回声</h3><div id="room-list">加载中...</div></div>

        <!-- 新增：倾听回声卡片 -->
        <div class="card">
            <h3 style="margin-bottom:12px;">🔑 倾听回声</h3>
            <p style="color:var(--text-secondary);font-size:14px;margin-bottom:12px;">输入回音口令，进入对话</p>
            <div class="input-group">
                <span class="icon">🔑</span>
                <input id="join-passcode-main" placeholder="例如：空谷-悠长的-901">
            </div>
            <button class="btn btn-primary" onclick="enterRoomFromMain()">侧耳倾听</button>
        </div>
        <!-- 新增结束 -->

        <button class="btn" style="background:transparent;color:var(--primary);border:1.5px solid var(--primary);margin-top:16px;" onclick="logout()">退出</button>
    </div>

    <div id="page-join" class="hidden">
        <div class="download-bar"><div><strong>📱 回声 App</strong><span style="font-size:13px;opacity:0.9;">更快更稳定</span></div><a href="#">下载</a></div>
        <div class="card text-center">
            <span style="font-size:40px;">🏔️</span>
            <h2>听到一声回声...</h2>
            <p style="color:var(--text-secondary);margin-bottom:20px;">输入回音口令倾听</p>
            <div class="input-group"><span class="icon">🔑</span><input id="join-passcode" placeholder="例如：空谷-悠长的-901"></div>
            <button class="btn btn-primary" onclick="joinRoom()">侧耳倾听</button>
            <p id="join-error" style="color:var(--danger);margin-top:8px;"></p>
        </div>
        <div id="chat-join" class="card hidden">
            <div class="chat-box" id="chat-box-join"></div>
            <div style="display:flex;gap:8px;margin-top:12px;">
                <input id="join-message" placeholder="你的回应..." style="flex:1;padding:12px;border-radius:50px;border:1px solid var(--border);">
                <button class="btn btn-primary" style="width:auto;padding:12px 24px;" onclick="sendJoinMsg()">发送</button>
            </div>
        </div>
    </div>
</div>

<script src="cloudbase.full.3.6.2.js"></script>

<script>
const ENV_ID = 'echo-d1ggxqxb47c1224f7';
let app, auth, db;
let currentUser = null, currentRoom = null, pollingInterval = null;

// ================= 程序入口 =================
window.onload = function() {
    if (typeof cloudbase === 'undefined') {
        document.body.innerHTML = '<div style="text-align:center;padding:40px;color:red;"><h3>SDK加载失败！</h3><p>请确保 <b>cloudbase.full.3.6.2.js</b> 文件与本 HTML 文件在同一目录下并正确上传。</p></div>';
        return;
    }

    app = cloudbase.init({ env: ENV_ID });
    
    // 初始化匿名登录状态，保障能安全调用云函数
    auth = app.auth({ persistence: "local" });
    db = app.database();

    // 自动触发匿名登录
    if (!auth.hasLoginState()) {
        auth.anonymousAuthProvider().signIn().catch(err => console.error("匿名登录失败:", err));
    }

    // 解析口令参数
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    
    if (code) {
        showPage('page-join');
        document.getElementById('join-passcode').value = code;
        joinRoom();
    } else {
        const savedUser = localStorage.getItem('echo_user');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            showPage('page-main');
            loadMyRooms();
        } else {
            showPage('page-auth');
        }
    }
};

function showPage(id) {
    document.querySelectorAll('[id^="page-"]').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

function switchTab(t) {
    document.getElementById('tab-login').classList.toggle('active', t==='login');
    document.getElementById('tab-register').classList.toggle('active', t==='register');
    document.getElementById('form-login').classList.toggle('hidden', t!=='login');
    document.getElementById('form-register').classList.toggle('hidden', t!=='register');
}

// ================= 登录：调用云函数直读 users 数据库表 =================
async function handleLogin() {
    const phone = document.getElementById('login-phone').value.trim();
    const pw = document.getElementById('login-password').value.trim();
    if (!phone || !pw) return alert('请输入手机号和密码');
    
    try {
        const res = await app.callFunction({
            name: 'dbApi',
            data: { action: 'query', collection: 'users', filter: { phone: phone, password: pw } }
        });
        
        if (!res.result || !res.result.data || res.result.data.length === 0) {
            return alert('手机号或密码错误');
        }
        
        currentUser = { uid: phone, phone: phone };
        localStorage.setItem('echo_user', JSON.stringify(currentUser));
        afterLogin();
    } catch(e) { 
        alert('登录失败: ' + e.message); 
    }
}

// ================= 注册：调用云函数直写 users 数据库表 =================
async function handleRegister() {
    const phone = document.getElementById('reg-phone').value.trim();
    const pw = document.getElementById('reg-password').value.trim();
    if (!phone || pw.length < 6) return alert('密码至少6位');
    
    try {
        const btn = document.querySelector('#form-register .btn');
        btn.disabled = true; btn.textContent = '正在注册...';

        // 1. 校验是否被注册
        const checkRes = await app.callFunction({
            name: 'dbApi',
            data: { action: 'query', collection: 'users', filter: { phone: phone } }
        });
        
        if (checkRes.result && checkRes.result.data && checkRes.result.data.length > 0) {
            alert('该手机号已注册，请直接登录');
            switchTab('login');
            return;
        }

        // 2. 直接向 users 写入数据
        await app.callFunction({
            name: 'dbApi',
            data: { 
                action: 'add', 
                collection: 'users', 
                data: { phone: phone, password: pw, createdAt: Date.now() } 
            }
        });

        alert('注册成功！正在为您登入...');
        currentUser = { uid: phone, phone: phone };
        localStorage.setItem('echo_user', JSON.stringify(currentUser));
        afterLogin();
    } catch(e) { 
        alert('注册失败: ' + (e.message || '网络通讯异常，请确认已在后台添加安全域名')); 
    } finally {
        const btn = document.querySelector('#form-register .btn');
        btn.disabled = false; btn.textContent = '创建账号';
    }
}

function afterLogin() {
    showPage('page-main');
    loadMyRooms();
}

function logout() {
    currentUser = null;
    localStorage.removeItem('echo_user');
    showPage('page-auth');
    if (pollingInterval) clearInterval(pollingInterval);
}

// ================= 创建房间 =================
async function createRoom() {
    if (!currentUser) return alert('请先登录');
    const phone = document.getElementById('target-phone').value.trim();
    const name = document.getElementById('your-name').value.trim();
    const content = document.getElementById('message-content').value.trim();
    if (!phone || !name || !content) return alert('请完整填写');

    const nouns = ['空谷','松涛','晚钟','风铃','潮汐','山泉','竹林','夜莺','鲸歌','风笛'];
    const adjs = ['悠长的','遥远的','轻柔的','清澈的','温暖的','寂静的','微弱的','坚定的'];
    const passcode = nouns[Math.floor(Math.random()*10)] + '-' + adjs[Math.floor(Math.random()*8)] + '-' + Math.floor(Math.random()*900+100);
    
    const joinLink = window.location.origin + window.location.pathname + '?code=' + encodeURIComponent(passcode);
    const smsText = name + ' 给你留下一声回声："' + content + '"。倾听请点击 ' + joinLink + ' 或输入口令：' + passcode + ' 。退订回T';

    const btn = document.getElementById('send-btn');
    btn.disabled = true; btn.textContent = '正在排队...';
    try {
        await app.callFunction({
            name: 'dbApi',
            data: { action: 'add', collection: 'rooms', data: { passcode, creatorId: currentUser.uid, targetPhone: phone, creatorName: name, initialMessage: content, status: 'pending', createdAt: Date.now() } }
        });
        await app.callFunction({
            name: 'dbApi',
            data: { action: 'add', collection: 'outbox', data: { phone, text: smsText, status: 'pending', createdAt: Date.now() } }
        });
        document.getElementById('result-passcode').textContent = passcode;
        document.getElementById('result-card').classList.remove('hidden');
        loadMyRooms();
    } catch(e) { alert('操作失败: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = '📡 发出回声'; }
}

async function loadMyRooms() {
    if (!currentUser) return;
    try {
        const res = await app.callFunction({
            name: 'dbApi',
            data: { action: 'query', collection: 'rooms', filter: { creatorId: currentUser.uid }, order: ['createdAt','desc'] }
        });
        const list = document.getElementById('room-list');
        if (!res.result || !res.result.data || res.result.data.length === 0) {
            list.innerHTML = '<p style="color:var(--text-secondary);text-align:center;">暂无回声</p>';
            return;
        }
        list.innerHTML = res.result.data.map(r => {
            return `<div class="room-item"><div><strong>${r.targetPhone}</strong><span style="color:var(--text-secondary);font-size:13px;"> · ${r.status==='replied'?'🟢已回复':'⏳等待中'}</span></div><span class="room-passcode">${r.passcode}</span></div>`;
        }).join('');
    } catch (e) {
        console.error("加载列表失败:", e);
    }
}

// ================= 加入房间 =================
async function joinRoom() {
    const pc = document.getElementById('join-passcode').value.trim();
    if (!pc) return;
    try {
        const res = await app.callFunction({
            name: 'dbApi',
            data: { action: 'query', collection: 'rooms', filter: { passcode: pc }, limit: 1 }
        });
        if (!res.result || !res.result.data || res.result.data.length === 0) {
            document.getElementById('join-error').textContent = '口令错误';
            return;
        }
        currentRoom = res.result.data[0];
        document.getElementById('page-join').querySelector('.card').classList.add('hidden');
        document.getElementById('chat-join').classList.remove('hidden');
        const box = document.getElementById('chat-box-join'); box.innerHTML = '';
        addMsg('system', '"' + currentRoom.creatorName + '" 的回声：');
        addMsg('other', currentRoom.initialMessage);
        startPolling();
    } catch(e) {
        document.getElementById('join-error').textContent = '查询出错: ' + e.message;
    }
}

// ================= 从主页面快速加入 =================
function enterRoomFromMain() {
    const code = document.getElementById('join-passcode-main').value.trim();
    if (!code) {
        alert('请输入回音口令');
        return;
    }
    showPage('page-join');
    document.getElementById('join-passcode').value = code;
    joinRoom();
}

// ================= 聊天消息相关 =================
function addMsg(type, text) {
    const box = document.getElementById('chat-box-join');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

async function sendJoinMsg() {
    if (!currentRoom) return;
    const text = document.getElementById('join-message').value.trim();
    if (!text) return;
    try {
        await app.callFunction({
            name: 'dbApi',
            data: { action: 'add', collection: 'messages', data: { roomId: currentRoom._id, senderType: 'guest', senderName: '匿名', content: text, createdAt: Date.now() } }
        });
        addMsg('mine', text);
        document.getElementById('join-message').value = '';
        await app.callFunction({
            name: 'dbApi',
            data: { action: 'update', collection: 'rooms', filter: { _id: currentRoom._id }, data: { status: 'replied' } }
        });
    } catch(e) {
        alert("发送失败: " + e.message);
    }
}

// 开启轮询同步聊天消息
function startPolling() {
    if (pollingInterval) clearInterval(pollingInterval);
    pollingInterval = setInterval(async () => {
        if (!currentRoom) return;
        try {
            const res = await app.callFunction({
                name: 'dbApi',
                data: { action: 'query', collection: 'messages', filter: { roomId: currentRoom._id }, order: ['createdAt','asc'], limit: 30 }
            });
            const box = document.getElementById('chat-box-join'); 
            box.innerHTML = '';
            addMsg('system', '"' + currentRoom.creatorName + '" 的回声：');
            addMsg('other', currentRoom.initialMessage);
            
            if (res.result && res.result.data) {
                res.result.data.forEach(m => addMsg(m.senderType==='guest'?'mine':'other', m.content));
            }
        } catch(e) {
            console.error("拉取新消息失败:", e);
        }
    }, 3000);
}
</script>
</body>
</html>
